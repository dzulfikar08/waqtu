# Design review shots, not store screenshots: Today without a location, the rest of the Today checklist, Circles, the
# lower half of Settings and the Ibadah tab with its tools, so a visual change can be checked on every tab in light and
# dark. Same demo build and data as screens.yaml.
#
#   maestro test --test-output-dir <dir> -e APP_ID=dat.waqtu.app -e LOCALE=en store/maestro/review.yaml
appId: ${APP_ID}
---
- launchApp:
    clearState: true
    permissions:
      all: allow
- extendedWaitUntil:
    visible: ".*(Hari ini|Today|isn't responding).*"
    timeout: 60000
- tapOn:
    text: Wait
    optional: true
- extendedWaitUntil:
    visible: ".*(Hari ini|Today).*"
    timeout: 60000
- waitForAnimationToEnd

# First run: no location yet.
- openLink: waqtu://demo?lang=${LOCALE}&to=today&loc=none
- extendedWaitUntil:
    visible: ".*(Set a location|Atur lokasi|Open in.*).*"
    timeout: 60000
- tapOn:
    text: Open
    optional: true
- extendedWaitUntil:
    visible: ".*(Set a location|Atur lokasi).*"
    timeout: 60000
- waitForAnimationToEnd
- takeScreenshot: ${LOCALE}-20-no-location

- openLink: waqtu://demo?lang=${LOCALE}&to=today
- extendedWaitUntil:
    visible: ".*(Next prayer|Sholat berikutnya|Open in.*).*"
    timeout: 60000
- tapOn:
    text: Open
    optional: true
- extendedWaitUntil:
    visible: ".*(Next prayer|Sholat berikutnya).*"
    timeout: 60000
- waitForAnimationToEnd
- scroll
- scroll
- waitForAnimationToEnd
- takeScreenshot: ${LOCALE}-21-checklist-more
- scroll
- scroll
- waitForAnimationToEnd
- takeScreenshot: ${LOCALE}-22-checklist-end

