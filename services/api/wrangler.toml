name = "waqt-updates"
main = "worker.ts"
compatibility_date = "2025-05-05"
compatibility_flags = ["nodejs_compat"]

[triggers]
# Hourly sweep of circle voice notes that were uploaded but never posted (older than 24h).
crons = ["17 * * * *"]

[vars]
# App Store numeric app id of Waqtu (not a secret): Production server notifications must carry it.
APPLE_APP_ID = "6826628861"
ENVIRONMENT = "production"
# Circles are Waqtu Premium (owner decision 2026-10-25): the app gates the tab and the API refuses joins/posts with 403 premium_required.
CIRCLES_REQUIRES_PREMIUM = "true"
# Store reviewer accounts (comma-separated): the only emails allowed to sign in with email + password.
# The accounts themselves are created by .github/workflows/review-account.yml.
REVIEW_ACCOUNT_EMAILS = "review@getwaqtu.com"

[[d1_databases]]
binding = "DB"
database_name = "waqt-releases-db"
database_id = "09cc030c-af46-437d-86c3-e15c3853939f"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "waqt-releases"

[[d1_databases]]
binding = "APP_DB"
database_name = "waqtu-db"
database_id = "ec7bbfbc-9f2c-4a25-a26c-6022d9cd1ebf"
migrations_dir = "migrations"

# Circle voice notes. Create it first: wrangler r2 bucket create waqtu-circle-media
[[r2_buckets]]
binding = "CIRCLE_MEDIA"
bucket_name = "waqtu-circle-media"
