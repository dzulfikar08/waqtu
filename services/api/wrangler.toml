name = "waqt-updates"
main = "worker.ts"
compatibility_date = "2025-05-05"
compatibility_flags = ["nodejs_compat"]

[triggers]
# Hourly sweep of circle voice notes that were uploaded but never posted (older than 24h).
crons = ["17 * * * *"]

[vars]
ENVIRONMENT = "production"
# Tells the app circles are a premium feature. DEV-12 flips this once entitlements exist.
CIRCLES_REQUIRES_PREMIUM = "false"

[[d1_databases]]
binding = "DB"
database_name = "waqt-releases-db"
database_id = "09cc030c-af46-437d-86c3-e15c3853939f"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "waqt-releases"

[[d1_databases]]
binding = "APP_DB"
database_name = "waqtu-db"
database_id = "ec7bbfbc-9f2c-4a25-a26c-6022d9cd1ebf"
migrations_dir = "migrations"

# Circle voice notes. Create it first: wrangler r2 bucket create waqtu-circle-media
[[r2_buckets]]
binding = "CIRCLE_MEDIA"
bucket_name = "waqtu-circle-media"
