# iOS release build for Waqtu (apps/mobile) on a GitHub macOS runner: `eas build --local` produces the signed IPA, and
# an optional step uploads it to App Store Connect (TestFlight).
#
# Manual only (Actions tab -> "Release iOS" -> Run workflow). The job is bound to the `release` environment, which holds
# these secrets (and should be limited to master):
#   EXPO_TOKEN                   Expo access token (run `eas init` once in apps/mobile and commit the projectId)
#   IOS_DIST_CERT_P12_BASE64     base64 of the Apple Distribution certificate (.p12)
#   IOS_DIST_CERT_PASSWORD
#   IOS_PROVISIONING_PROFILE_BASE64  base64 of the App Store profile for dat.waqtu.ios
#   ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_BASE64   App Store Connect API key (.p8), only for the TestFlight upload
# Nothing is uploaded unless `upload_testflight` is ticked.
name: Release iOS

on:
  workflow_dispatch:
    inputs:
      upload_testflight:
        description: "Upload the IPA to App Store Connect (TestFlight)"
        type: boolean
        default: false
      xcode_version:
        description: "Xcode version (semver range for maxim-lobanov/setup-xcode, e.g. 26.x or latest-stable)"
        type: string
        default: latest-stable

permissions:
  contents: read

concurrency:
  group: release-ios
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 90
    environment: release
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      UPLOAD: ${{ inputs.upload_testflight && '1' || '0' }}
      EAS_NO_VCS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: ${{ inputs.xcode_version }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Cache CocoaPods downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/CocoaPods
          key: ios-pods-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: ios-pods-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The production profile in eas.json uses credentialsSource=local, which reads this credentials.json.
      - name: Write signing credentials
        working-directory: apps/mobile
        env:
          P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$P12_BASE64" | base64 --decode > dist.p12
          printf '%s' "$PROFILE_BASE64" | base64 --decode > store.mobileprovision
          jq -n --arg p "$P12_PASSWORD" \
            '{ios:{provisioningProfilePath:"store.mobileprovision",distributionCertificate:{path:"dist.p12",password:$p}}}' > credentials.json

      - name: Build with EAS (local)
        working-directory: apps/mobile
        run: bunx eas-cli@latest build --local --non-interactive --platform ios --profile production --output "$RUNNER_TEMP/Waqtu.ipa"

      - name: Checksum
        run: shasum -a 256 "$RUNNER_TEMP/Waqtu.ipa" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: waqtu-ios-${{ github.run_number }}
          path: ${{ runner.temp }}/Waqtu.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload to TestFlight
        if: env.UPLOAD == '1'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
        run: |
          umask 077
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$ASC_KEY_BASE64" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          xcrun altool --upload-app --type ios --file "$RUNNER_TEMP/Waqtu.ipa" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Remove signing material
        if: always()
        run: |
          rm -f apps/mobile/dist.p12 apps/mobile/store.mobileprovision apps/mobile/credentials.json
          rm -f ~/.appstoreconnect/private_keys/AuthKey_*.p8
