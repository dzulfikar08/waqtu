name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks (full history)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git --no-banner --redact .

  # TEMP (mobile-design-r2): formats the branch and uploads the diff, so it can be applied without running oxfmt locally.
  fmt-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bunx oxfmt . && git diff > fmt.patch && wc -l fmt.patch
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fmt-patch
          path: fmt.patch

  web-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run fmt:check
      - run: bun run typecheck
      - run: bun run build
      - run: bun run test

  mobile:
    # Bundles the Expo app for both platforms and checks the Android native project generates.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bunx expo export --platform android --platform ios
        working-directory: apps/mobile
      - run: bunx expo prebuild --no-install --platform android
        working-directory: apps/mobile

  apple:
    # Unsigned compile of every Apple target; free on public repos.
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - scheme: waqtu
            destination: generic/platform=macOS
          - scheme: waqtu-mas
            destination: generic/platform=macOS
          - scheme: waqtu-ios
            destination: generic/platform=iOS
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable
      - name: xcodebuild ${{ matrix.scheme }}
        working-directory: apps/apple
        run: |
          xcodebuild build \
            -project waqt.xcodeproj \
            -scheme "${{ matrix.scheme }}" \
            -destination "${{ matrix.destination }}" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
      - name: xcodebuild test waqtu (sync, mapping and Ramadhan unit tests)
        if: matrix.scheme == 'waqtu'
        working-directory: apps/apple
        run: |
          xcodebuild test \
            -project waqt.xcodeproj \
            -scheme waqtu \
            -destination "platform=macOS" \
            -only-testing:waqtuTests \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

  prayer-parity:
    # App SharedPrayerCalculator (apps/apple/shared, same Adhan-Swift pin) vs @waqtu/core: 10 cities x 365 days, MWL + Kemenag, ±1 min.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Adhan-Swift pin matches the app
        run: |
          app=$(grep -A8 '"adhan-swift"' apps/apple/waqt.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved | sed -n 's/.*"version" : "\(.*\)".*/\1/p')
          pkg=$(sed -n 's/.*exact: "\(.*\)".*/\1/p' apps/apple/parity/Package.swift)
          echo "app=$app parity=$pkg"
          test -n "$app" && test "$app" = "$pkg"
      - name: Emit Adhan-Swift times
        working-directory: apps/apple/parity
        run: swift run -c release parity ../../../packages/core/parity/cities.json 2026 > "$RUNNER_TEMP/swift.json"
      - name: Compare with @waqtu/core
        run: bun packages/core/parity/compare.ts "$RUNNER_TEMP/swift.json" 2026 1
