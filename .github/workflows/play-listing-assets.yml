# Builds the Google Play listing graphics on a runner and publishes them as the `play-listing-assets` pre-release, so the
# Play Console upload can fetch them by URL (no local machine):
#   icon-512.png              512x512 app icon (from apps/mobile/assets/icon.png)
#   feature-graphic.png       1024x500 feature graphic (icon + name + tagline on the brand gradient)
#   phone-{id,en}-0N.png      phone screenshots from a Store screenshots run (Pixel 6), 1080x1920-class PNGs
#
# Manual only. `screenshots_run` defaults to the latest successful Store screenshots run.
name: Play listing assets

on:
  workflow_dispatch:
    inputs:
      screenshots_run:
        description: "Store screenshots run id (empty = latest successful)"
        type: string
        required: false

permissions:
  contents: write
  actions: read

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_ID: ${{ inputs.screenshots_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick fonts-dejavu-core >/dev/null

      - name: Icon and feature graphic
        run: |
          mkdir -p out
          convert apps/mobile/assets/icon.png -resize 512x512 -strip out/icon-512.png
          convert -size 1024x500 gradient:'#1A2E25'-'#2D5F4C' \
            \( apps/mobile/assets/icon.png -resize 260x260 -alpha set \
               \( -size 260x260 xc:none -fill white -draw "roundrectangle 0,0 259,259 58,58" \) \
               -compose DstIn -composite \) -compose Over -geometry +90+120 -composite \
            -font DejaVu-Sans-Bold -pointsize 78 -fill '#E8F0ED' -annotate +400+235 'Waqtu' \
            -font DejaVu-Sans -pointsize 34 -fill '#D4A574' -annotate +404+300 'Sholat · Mutabaah · Ramadhan' \
            -font DejaVu-Sans -pointsize 26 -fill '#A8C9B8' -annotate +404+350 'Lokasi tidak keluar dari ponsel' \
            -alpha off -depth 8 -strip out/feature-graphic.png
          identify out/icon-512.png out/feature-graphic.png

      - name: Phone screenshots
        run: |
          if [ -z "$RUN_ID" ]; then
            RUN_ID=$(gh run list -w store-screenshots.yml -s success -L 1 --json databaseId --jq '.[0].databaseId')
          fi
          gh run download "$RUN_ID" -n screenshots-android-pixel_6 -D shots
          for lang in id en; do
            i=0
            for f in $(find shots -maxdepth 3 -path '*review*' -prune -o -name "${lang}-0*.png" -print | sort); do
              i=$((i + 1)); cp "$f" "out/phone-${lang}-0${i}.png"
            done
          done
          ls -la out
          test -n "$(ls out/phone-id-0*.png 2>/dev/null)"

      - name: Publish pre-release
        run: |
          gh release delete play-listing-assets --yes --cleanup-tag 2>/dev/null || true
          gh release create play-listing-assets out/*.png --prerelease --target "$GITHUB_SHA" \
            --title "Play listing assets" --notes "Generated by the Play listing assets workflow for the Google Play store listing."
          echo "https://github.com/$GH_REPO/releases/tag/play-listing-assets" >> "$GITHUB_STEP_SUMMARY"
