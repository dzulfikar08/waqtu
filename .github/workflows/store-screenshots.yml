# Store screenshots for Waqtu (apps/mobile), id + en: a demo build runs on an Android emulator (Pixel 6 and Pixel 7 Pro)
# and an iPhone Pro Max simulator (6.9"), and Maestro (apps/mobile/store/maestro/screens.yaml) captures each screen.
#
# Manual only (Actions tab -> "Store screenshots" -> Run workflow). No secrets: both apps are unsigned debug-signed
# builds. They are built with EXPO_PUBLIC_DEMO_MODE=1, which freezes the clock at 12 Feb 2027 17:00 WIB and lets
# `waqtu://demo?lang=..&to=..` load deterministic demo data (see apps/mobile/src/demo). No other workflow or EAS profile
# sets that flag, so store builds never contain demo data. No network is needed or used (EXPO_PUBLIC_API_URL is unset).
name: Store screenshots

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "Which platforms to capture"
        type: choice
        options: [both, android, ios]
        default: both
      apk_run_id:
        description: "Reuse the demo APK of this earlier run instead of building it (Android only)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: store-screenshots-${{ github.ref }}
  cancel-in-progress: true

env:
  MAESTRO_VERSION: 2.11.0

jobs:
  build-android:
    if: inputs.platforms != 'ios' && inputs.apk_run_id == ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_DEMO_MODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Gradle JVM settings
        run: |
          mkdir -p ~/.gradle
          cat >> ~/.gradle/gradle.properties <<'EOF2'
          org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC
          org.gradle.parallel=true
          EOF2

      - run: bun install --frozen-lockfile

      - name: Prebuild
        working-directory: apps/mobile
        run: bunx expo prebuild --no-install --platform android --clean

      # Release variant so the JS bundle is embedded (no Metro). Expo's template signs it with the debug key.
      # x86_64 only: the emulator below is x86_64.
      - name: Build APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: waqtu-demo-apk
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7

  android:
    needs: build-android
    if: ${{ !cancelled() && inputs.platforms != 'ios' && needs.build-android.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        profile: [pixel_6, pixel_7_pro]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: waqtu-demo-apk
          path: apk
          run-id: ${{ inputs.apk_run_id || github.run_id }}
          github-token: ${{ github.token }}

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Maestro
        run: |
          curl -fsSL https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.profile }}
          ram-size: 4096M
          disable-animations: true
          script: apps/mobile/store/scripts/android-shots.sh "$(ls $PWD/apk/*.apk | head -n 1)" "$PWD/shots/android-${{ matrix.profile }}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: screenshots-android-${{ matrix.profile }}
          path: shots/
          if-no-files-found: error
          retention-days: 30

  ios:
    if: inputs.platforms != 'android'
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      EXPO_PUBLIC_DEMO_MODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - run: bun install --frozen-lockfile

      - name: Prebuild
        working-directory: apps/mobile
        run: bunx expo prebuild --platform ios --clean

      - name: Build simulator app
        working-directory: apps/mobile/ios
        run: |
          xcodebuild build \
            -workspace Waqtu.xcworkspace \
            -scheme Waqtu \
            -configuration Release \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Install Maestro
        run: |
          curl -fsSL https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Capture
        run: apps/mobile/store/scripts/ios-shots.sh "$PWD/apps/mobile/ios/build/Build/Products/Release-iphonesimulator/Waqtu.app" "$PWD/shots/ios-iphone-pro-max"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: screenshots-ios-iphone-pro-max
          path: shots/
          if-no-files-found: error
          retention-days: 30
