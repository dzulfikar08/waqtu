# Unsigned native compile of the Expo app (apps/mobile) on pull requests that touch it: Kotlin/Java and resources on
# Android, Swift on iOS with and without the opt-in countdown widget extension (WAQTU_IOS_WIDGET=1). CI's `mobile` job
# only checks that the Android project generates; this one builds it. Nothing is signed or uploaded.
name: Mobile native build

on:
  pull_request:
    paths:
      - "apps/mobile/**"
      - "packages/core/**"
      - "bun.lock"
      - ".github/workflows/mobile-native.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY/CodeQL"
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: bun install --frozen-lockfile
      - run: bunx expo prebuild --no-install --platform android
        working-directory: apps/mobile
      # One ABI keeps the C++ part short; the Kotlin, resources and merged manifest are the same for all.
      - name: assembleDebug
        working-directory: apps/mobile/android
        run: ./gradlew :app:assembleDebug -PreactNativeArchitectures=arm64-v8a --no-daemon
      - name: Widget receiver is in the merged manifest
        working-directory: apps/mobile/android
        run: |
          manifest=$(find app/build/intermediates/merged_manifests/debug -name AndroidManifest.xml | head -1)
          grep -q 'dat.waqtu.countdown.WaqtuCountdownWidget' "$manifest"
          grep -q 'android.appwidget.provider' "$manifest"

  ios:
    runs-on: macos-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        widget: ["0", "1"]
    name: ios (WAQTU_IOS_WIDGET=${{ matrix.widget }})
    env:
      WAQTU_IOS_WIDGET: ${{ matrix.widget }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/CocoaPods
          key: ios-pods-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: ios-pods-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bunx expo prebuild --platform ios
        working-directory: apps/mobile
      - name: Targets in the project
        working-directory: apps/mobile/ios
        run: |
          xcodebuild -list -workspace Waqtu.xcworkspace | tee "$RUNNER_TEMP/targets.txt"
          if [ "$WAQTU_IOS_WIDGET" = "1" ]; then grep -q CountdownWidget "$RUNNER_TEMP/targets.txt"; else ! grep -q CountdownWidget "$RUNNER_TEMP/targets.txt"; fi
      - name: xcodebuild (simulator, unsigned)
        working-directory: apps/mobile/ios
        run: |
          xcodebuild build \
            -workspace Waqtu.xcworkspace \
            -scheme Waqtu \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
