# Direct-download macOS release: build → Developer ID sign → notarize → DMG → Sparkle sign → R2 + D1.
# Runs apps/apple/scripts/release.sh, the same script used on a Mac.
#
# Manual only. Secrets live in the `release` environment:
#   DEVELOPER_ID_P12_BASE64, DEVELOPER_ID_P12_PASSWORD   Developer ID Application certificate (.p12)
#   ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_BASE64            App Store Connect API key (.p8) for notarytool
#   SPARKLE_ED_PRIVATE_KEY                               Sparkle EdDSA private key (base64 seed, as `generate_keys -x` exports)
#   MACOS_DEVELOPER_ID_PROFILE_BASE64                    Developer ID provisioning profile for dat.waqtu (Sign in with Apple, iCloud)
#   MACOS_WIDGET_DEVELOPER_ID_PROFILE_BASE64             Developer ID provisioning profile for dat.waqtu.mac-widget
#   RELEASE_UPLOAD_TOKEN                                 Bearer token of the updates worker's /releases API (DMG → R2, row → D1)
name: Release macOS

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Marketing version, e.g. 1.11.0"
        type: string
        required: true
      build:
        description: "Build number (CFBundleVersion), an integer greater than the newest sparkle:version in the appcast"
        type: string
        required: true
      description:
        description: "Release notes shown in the Sparkle update dialog"
        type: string
        default: "Bug fixes and improvements."
      dry_run:
        description: "Build, sign and notarize, but do not upload or publish (SKIP_UPLOAD=1)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-macos
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 90
    environment: release
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      RELEASE_UPLOAD_TOKEN: ${{ secrets.RELEASE_UPLOAD_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile

      - name: Import Developer ID certificate
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          kc="$RUNNER_TEMP/release.keychain-db"
          kcpass="$(uuidgen)"
          printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/devid.p12"
          security create-keychain -p "$kcpass" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kcpass" "$kc"
          security import "$RUNNER_TEMP/devid.p12" -k "$kc" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kcpass" "$kc" > /dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/devid.p12"
          identity="$(security find-identity -v -p codesigning "$kc" | grep 'Developer ID Application' | head -1 | awk '{print $2}')"
          if [ -z "$identity" ]; then echo "::error::No Developer ID Application identity in the imported .p12"; exit 1; fi
          echo "CODESIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Install provisioning profiles
        env:
          APP_PROFILE_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_PROFILE_BASE64 }}
          WIDGET_PROFILE_BASE64: ${{ secrets.MACOS_WIDGET_DEVELOPER_ID_PROFILE_BASE64 }}
        run: |
          printf '%s' "$APP_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/waqtu.provisionprofile"
          printf '%s' "$WIDGET_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/waqtu-widget.provisionprofile"
          echo "PROVISIONING_PROFILE_PATH=$RUNNER_TEMP/waqtu.provisionprofile" >> "$GITHUB_ENV"
          echo "WIDGET_PROVISIONING_PROFILE_PATH=$RUNNER_TEMP/waqtu-widget.provisionprofile" >> "$GITHUB_ENV"

      - name: Store notarization credentials
        env:
          ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
        run: |
          umask 077
          key="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_KEY_BASE64" | base64 --decode > "$key"
          xcrun notarytool store-credentials waqtu-notary --key "$key" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" \
            --keychain "$RUNNER_TEMP/release.keychain-db"

      - name: Write Sparkle key
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          umask 077
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" > "$RUNNER_TEMP/sparkle_ed.key"
          echo "SPARKLE_ED_KEY_FILE=$RUNNER_TEMP/sparkle_ed.key" >> "$GITHUB_ENV"

      - name: Release
        working-directory: apps/apple
        env:
          NOTARIZE: "1"
          NOTARY_KEYCHAIN: ${{ runner.temp }}/release.keychain-db
          VERSION: ${{ inputs.version }}
          BUILD: ${{ inputs.build }}
          NOTES: ${{ inputs.description }}
          SKIP_UPLOAD: ${{ inputs.dry_run && '1' || '0' }}
        run: ./scripts/release.sh "$VERSION" "$NOTES"

      - name: Clean up signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/release.keychain-db" || true
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8 "$RUNNER_TEMP/sparkle_ed.key" "$RUNNER_TEMP"/*.provisionprofile
