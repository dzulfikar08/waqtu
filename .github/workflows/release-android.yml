# Android release build for Waqtu (apps/mobile) on GitHub Actions: `eas build --local`, so the build runs on this runner
# and only the project metadata talks to Expo.
#
# Manual only (Actions tab -> "Release Android" -> Run workflow). The job is bound to the `release` environment, which holds
# these secrets (and should be limited to master):
#   EXPO_TOKEN                   Expo access token of the project owner (eas build needs the linked EAS project;
#                                run `eas init` once in apps/mobile and commit the projectId in app.json)
#   ANDROID_KEYSTORE_BASE64      base64 of the upload keystore (.jks)
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
#   PLAY_SERVICE_ACCOUNT_JSON    only for the Play upload (raw JSON)
# Uploads are off by default. The first upload to a new Play app may have to be play_status=draft.
name: Release Android

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "EAS build profile (production = signed AAB, preview = APK)"
        type: choice
        options: [production, preview]
        default: production
      play_track:
        description: "Upload the AAB to this Play track (none = artifact only; production profile only)"
        type: choice
        options: [none, internal, alpha, beta]
        default: none
      play_status:
        description: "Release status when uploading (draft = review it in Play Console first)"
        type: choice
        options: [draft, completed]
        default: draft

permissions:
  contents: read

concurrency:
  group: release-android
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: release
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      PROFILE: ${{ inputs.profile }}
      PLAY_TRACK: ${{ inputs.play_track }}
      PLAY_STATUS: ${{ inputs.play_status }}
      EAS_NO_VCS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/node_modules/.cache "$AGENT_TOOLSDIRECTORY/CodeQL"

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: false

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The production profile in eas.json uses credentialsSource=local, which reads this credentials.json.
      - name: Write signing credentials
        if: env.PROFILE == 'production'
        working-directory: apps/mobile
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > release.jks
          jq -n --arg p "$STORE_PASSWORD" --arg a "$KEY_ALIAS" --arg k "$KEY_PASSWORD" \
            '{android:{keystore:{keystorePath:"release.jks",keystorePassword:$p,keyAlias:$a,keyPassword:$k}}}' > credentials.json

      - name: Build with EAS (local)
        working-directory: apps/mobile
        run: |
          ext=apk
          if [ "$PROFILE" = production ]; then ext=aab; fi
          bunx eas-cli@latest build --local --non-interactive --platform android --profile "$PROFILE" --output "$RUNNER_TEMP/waqtu-android-$PROFILE.$ext"

      - name: Checksum
        run: sha256sum "$RUNNER_TEMP"/waqtu-android-* | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: waqtu-android-${{ github.run_number }}
          path: ${{ runner.temp }}/waqtu-android-*
          if-no-files-found: error
          retention-days: 30

      - name: Upload to Google Play
        if: env.PLAY_TRACK != 'none' && env.PROFILE == 'production'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: dat.waqtu.app
          releaseFiles: ${{ runner.temp }}/waqtu-android-production.aab
          track: ${{ env.PLAY_TRACK }}
          status: ${{ env.PLAY_STATUS }}

      - name: Remove signing material
        if: always()
        run: rm -f apps/mobile/release.jks apps/mobile/credentials.json
