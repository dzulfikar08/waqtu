name: Waqtu
options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  WaqtuCore:
    path: WaqtuCore
targets:
  Waqtu:
    type: application
    platform: iOS
    sources:
      - iOS/Waqtu
    dependencies:
      - package: WaqtuCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.waqtu.ios
    info:
      path: iOS/Waqtu/Info.plist
      properties:
        CFBundleDisplayName: Waqtu
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocationWhenInUseUsageDescription: Waqtu uses your location once to calculate local prayer times. Times are computed on device and your location is never collected or sent anywhere.
  Waqtu Watch App:
    type: application
    platform: watchOS
    sources:
      - watchOS/Waqtu Watch
    dependencies:
      - package: WaqtuCore
      - target: Waqtu Watch Complications
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.waqtu.watchkitapp
    entitlements:
      path: watchOS/Waqtu Watch/WaqtuWatch.entitlements
      properties:
        com.apple.security.application-groups: [group.com.waqtu.prayer]
    info:
      path: watchOS/Waqtu Watch/Info.plist
      properties:
        CFBundleDisplayName: Waqtu
        WKApplication: true
        NSLocationWhenInUseUsageDescription: Waqtu uses your location once to calculate local prayer times on watch.
  Waqtu Watch Complications:
    type: app-extension
    platform: watchOS
    sources:
      - watchOS/Complications
      - watchOS/Waqtu Watch/SharedPrayerSettings.swift
    dependencies:
      - package: WaqtuCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.waqtu.watchkitapp.complications
    entitlements:
      path: watchOS/Complications/WaqtuComplications.entitlements
      properties:
        com.apple.security.application-groups: [group.com.waqtu.prayer]
    info:
      path: watchOS/Complications/Info.plist
      properties:
        CFBundleDisplayName: Waqtu Complications
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
schemes:
  Waqtu:
    build:
      targets:
        Waqtu: all
    run:
      config: Debug
  Waqtu Watch App:
    build:
      targets:
        Waqtu Watch App: all
    run:
      config: Debug
