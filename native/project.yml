name: Waqtu
options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  WaqtuCore:
    path: WaqtuCore
targets:
  Waqtu:
    type: application
    platform: iOS
    sources:
      - iOS/Waqtu
    dependencies:
      - package: WaqtuCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.waqtu.ios
    info:
      path: iOS/Waqtu/Info.plist
      properties:
        CFBundleDisplayName: Waqtu
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocationWhenInUseUsageDescription: Waqtu uses your location once to calculate local prayer times. Times are computed on device and your location is never collected or sent anywhere.
schemes:
  Waqtu:
    build:
      targets:
        Waqtu: all
    run:
      config: Debug
